      - name: "Configure & Start Remote Desktop"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CRD_PIN -notmatch '^\d{6,}$') {
            throw "PIN must be at least 6 digits."
          }

          # Extract --code directly from your pasted command
          if ($env:RAW_CODE -notmatch '--code="([^"]+)"') {
            throw "Could not find --code=`"...`" in your input. Paste the full Windows PowerShell command."
          }
          $authCode = ($env:RAW_CODE -replace '.*--code="([^"]+)".*', '$1').Trim()

          # Extract --redirect-url directly from your pasted command (falls back if missing)
          if ($env:RAW_CODE -match '--redirect-url="([^"]+)"') {
            $redirectUrl = ($env:RAW_CODE -replace '.*--redirect-url="([^"]+)".*', '$1').Trim()
          } else {
            $redirectUrl = "https://google.com"
          }

          Write-Host "Extracted auth code length: $($authCode.Length) characters."
          Write-Host "Using redirect URL: $redirectUrl"

          # Dynamically locate remoting_start_host.exe inside versioned folders
          $searchPaths = @(
            "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop",
            "$env:ProgramFiles\Google\Chrome Remote Desktop"
          ) | Where-Object { Test-Path $_ }

          $crdExe = Get-ChildItem -Path $searchPaths -Filter "remoting_start_host.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          if (-not $crdExe) {
            throw "remoting_start_host.exe was not found after installation."
          }

          Write-Host "Found executable at: $crdExe"
          Write-Host "Registering host with Chrome Remote Desktop..."
          & $crdExe --code="$authCode" --redirect-url="$redirectUrl" --name="$env:COMPUTERNAME" --pin="$env:CRD_PIN"

          Write-Host "Setup complete! Open Chrome Remote Desktop Access and use PIN: $($env:CRD_PIN)"
