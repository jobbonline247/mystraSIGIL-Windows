name: "⚡🔐✋ mystraSIGIL - Standalone Windows"

on:
  workflow_dispatch:
    inputs:
      RUNNER_PROFILE:
        description: "Select Profile"
        required: true
        type: choice
        default: "Windows High Performance"
        options:
          - "Windows 64 Core"
          - "Windows 11 ARM"
          - "Windows High Performance"
          - "Windows ARM Enterprise"
      CODE:
        description: "Full headless command (Windows PowerShell)"
        required: true
      PIN:
        description: "6-Digit Remote Desktop PIN"
        required: true
        default: "123456"

permissions:
  contents: read

jobs:
  initializing-automation:
    name: "Initializing Automation"
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      runner_label: ${{ steps.resolve.outputs.runner_label }}
    defaults:
      run:
        shell: pwsh
    steps:
      - id: resolve
        env:
          PROFILE: ${{ github.event.inputs.RUNNER_PROFILE }}
        run: |
          $runnerLabel = switch ($env:PROFILE) {
            "Windows 64 Core"          { "windows-2022" }
            "Windows 11 ARM"           { "windows-11-arm" }
            "Windows High Performance" { "windows-2025" }
            "Windows ARM Enterprise"   { "windows-11-vs2026-arm" }
            default                    { "windows-2025" }
          }
          Write-Host "Selected Profile: '$($env:PROFILE)' -> Runner: $runnerLabel"
          "runner_label=$runnerLabel" >> $env:GITHUB_OUTPUT

  crd-register:
    name: "mystraSIGIL Desktop"
    needs: initializing-automation
    runs-on: ${{ needs.initializing-automation.outputs.runner_label }}
    timeout-minutes: 360

    env:
      RAW_CODE: ${{ github.event.inputs.CODE }}
      CRD_PIN:  ${{ github.event.inputs.PIN }}

    defaults:
      run:
        shell: pwsh

    steps:
      - name: "Install Chrome Remote Desktop & Tools"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Chrome Remote Desktop Host..."
          $msiPath = "$env:TEMP\chromeremotedesktophost.msi"
          Invoke-WebRequest -Uri "https://google.com" -OutFile $msiPath
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msiPath`" /qn /norestart"
          Write-Host "Chrome Remote Desktop installed."

          Write-Host "Installing Brave Browser & VS Code..."
          winget install --id Brave.Brave -e --silent --accept-package-agreements --accept-source-agreements
          winget install --id Microsoft.VisualStudioCode -e --silent --accept-package-agreements --accept-source-agreements

      - name: "Configure & Start Remote Desktop"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CRD_PIN -notmatch '^\d{6,}$') {
            throw "PIN must be at least 6 digits."
          }

          # Extract the --code value from the full headless command
          if ($env:RAW_CODE -match '--code="([^"]+)"') {
            $authCode = $Matches[1]
          } else {
            throw "Could not find --code=`"...`" in your input. Please paste the full Windows PowerShell command from ://google.com."
          }

          $crdExe = "${env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $crdExe)) {
            $crdExe = "$env:ProgramFiles\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          }

          Write-Host "Registering host with Chrome Remote Desktop..."
          & $crdExe --code="$authCode" --redirect-url="https://google.com" --name="$env:COMPUTERNAME" --pin="$env:CRD_PIN"

          Write-Host "Setup complete! Connect at https://google.com using PIN: $($env:CRD_PIN)"

      - name: "Keep Session Alive"
        run: |
          Write-Host "Keeping runner active for up to 5.5 hours..."
          Start-Sleep -Seconds 19800
